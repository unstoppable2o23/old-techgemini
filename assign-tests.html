<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assign Stream‑Selector / Ideal‑Career Tests</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { padding: 2rem; font-family: system-ui, sans-serif; }
  .card { margin-top: 1rem; }
  .token-row { cursor: pointer; }
</style>
</head>
<body>

<div class="container">
  <h2 class="mb-3">Assign a Test to a Student</h2>

  <form id="assignForm">
    <div class="mb-3">
      <label class="form-label">Student Name / ID</label>
      <input type="text" id="studentName" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Test Type</label>
      <select id="testType" class="form-control" required>
        <option value="stream">Stream Selector (76 questions – recommends a stream)</option>
        <option value="ideal">Ideal Career (182 questions – 5 aptitudes + report)</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Generate Assignment</button>
  </form>

  <hr class="my-4">

  <h4>Current Assignments (stored in this browser)</h4>
  <div id="assignmentsList" class="list-group"></div>
</div>

<!--  ---------------------------------------------------------------- -->
<!--  Scoring functions (client‑side, no backend needed)               -->
<!--  ---------------------------------------------------------------- -->
<script>
/* ----------  Stream Selector – 76 questions  ---------- */
window.StreamQuestions = /* → will be filled below */;

/* ----------  Ideal Career – 182 questions  ---------- */
window.IdealQuestions = /* → will be filled below */;

/* ----------  Helper: random token (10‑char alphanumeric) ---------- */
function makeToken() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let tok = '';
  for (let i = 0; i < 10; i++) tok += chars[Math.floor(Math.random()*chars.length)];
  return tok;
}

/* ----------  Scoring (same logic I gave earlier) ---------- */
function computeStream(studentAnswers) {
  // studentAnswers = { "5023": "12997", ... }   // option‑ID strings
  const questions = window.StreamQuestions;
  const subdomainScores = {1:0,2:0,3:0,4:0};
  for (const [qid, optId] of Object.entries(studentAnswers)) {
    const q = questions[qid];
    if (!q) continue;
    const opt = Object.values(q.options).find(o => String(o.id) === String(optId));
    if (!opt) continue;
    const sd = q.subdomain_id;
    subdomainScores[sd] = (subdomainScores[sd]||0) + opt.marks;
  }
  const MAP = {1:"Humanities",2:"Science",3:"Commerce",4:"Arts"};
  const best = Object.entries(subdomainScores).reduce((a,b)=> b[1]>a[1] ? b : a)[0];
  return {subdomainScores, recommendedStream: MAP[best]||"Undecided", totals: subdomainScores};
}

function computeIdealCareer(studentAnswers) {
  const questions = window.IdealQuestions;
  const totals = {};
  for (const [qid, optId] of Object.entries(studentAnswers)) {
    const q = questions[qid];
    if (!q) continue;
    const opt = Object.values(q.options).find(o => String(o.id) === String(optId));
    if (!opt) continue;
    const sd = q.subdomain_id;
    totals[sd] = (totals[sd]||0) + opt.marks;
  }
  // Very simple mapping – you’ll need to confirm the exact sub‑→‑aptitude table
  const SUBDOMAIN_APTITUDE_MAP = {
    "274":"Verbal","275":"Verbal","276":"Verbal",
    "277":"Numerical","278":"Numerical","279":"Spatial","280":"Spatial",
    "281":"Critical Deduction","282":"Critical Deduction"
    // add the rest (283‑315) as needed
  };
  const aptitudeScores = {Verbal:0,Numerical:0,Spatial:0,
    "Critical Deduction":0,Acuteness:0};
  for (const [sd,score] of Object.entries(totals)) {
    const apt = SUBDOMAIN_APTITUDE_MAP[sd];
    if (!apt) continue;
    aptitudeScores[apt] += score;
  }
  const sorted = Object.entries(aptitudeScores).sort((a,b)=>b[1]-a[1]);
  return {
    subdomainTotals: totals,
    aptitudeScores,
    recommendedAptitude: sorted[0]?.[0]||"Unknown",
    topThreeAptitudes: sorted.slice(0,3).map(([a])=>a)
  };
}

/* ----------  Load the question banks (once) ---------- */
document.addEventListener('DOMContentLoaded', async () => {
  // ---- Stream Selector (76 items) ----
  const ssRes = await fetch('streamSelectorQuestions.js');
  const ssJson = await ssRes.text();
  window.StreamQuestions = JSON.parse(ssJson).questions || [];

  // ---- Ideal Career (182 items) ----
  const icRes = await fetch('idealCareerQuestions.js');
  const icJson = await icRes.text();
  window.IdealQuestions = JSON.parse(icJson).questions || [];

  console.log('Loaded', window.StreamQuestions.length, 'Stream questions');
  console.log('Loaded', window.IdealQuestions.length, 'Ideal questions');
});


/* ----------  Form handling ---------- */
document.getElementById('assignForm').addEventListener('submit', async e => {
  e.preventDefault();
  const student = document.getElementById('studentName').value.trim();
  const type   = document.getElementById('testType').value;
  if (!student) return alert('Enter a student name / ID.');

  const token = makeToken();
  const assignment = {
    student,
    testType: type,
    token,
    created: new Date().toISOString()
  };

  // store in localStorage (key = token)
  localStorage.setItem('assignment_'+token, JSON.stringify(assignment));

  // add to UI list
  const list = document.getElementById('assignmentsList');
  const li = document.createElement('li');
  li.className = 'list-group-item d-flex justify-content-between align-items-center';
  li.innerHTML = `
    <span><strong>${student}</strong> – ${type}</span>
    <span class="token-row" onclick="copyToken('${token}')">Token: ${token}</span>
  `;
  list.prepend(li);

  // show the start‑URL the student will use
  const startUrl = `https://your‑domain.com/exam/starttest/${token}`; // ← replace with your actual domain
  alert(`Assignment ready!\nStudent: ${student}\nTest: ${type}\nToken: ${token}\nStudent URL: ${startUrl}`);
  document.getElementById('studentName').value = '';
});

/* ----------  Copy token to clipboard ---------- */
function copyToken(tok) {
  navigator.clipboard.writeText(tok).then(()=>alert('Token copied!'));
}
</script>

</body>
</html>
